# No incluye ningún archivo del juego: el juego se prepara en tu PC desde tu propia copia.
name: build-windows

on:
  workflow_dispatch:        # botón "Run workflow" en la pestaña Actions
    inputs:
      ref:
        description: 'Etiqueta del repo de raulzrrs/letsgo-recomp a compilar'
        default: 'v0.4.2'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      # Los scripts bash del proyecto se rompen con CRLF: el checkout debe usar LF.
      - name: Fin de línea LF
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      # Descarga el código del autor en la versión pedida (no depende del estado de tu fork).
      - uses: actions/checkout@v4
        with:
          repository: raulzrrs/letsgo-recomp
          ref: ${{ inputs.ref || 'v0.4.2' }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Aplica el parche SSE4.2: Makefile (v3 -> v2) y la comprobación de CPU al arrancar (AVX2 -> SSE4.2 + POPCNT).
      - name: Aplicar cambios SSE4.2 (sin AVX2)
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, sys

          def read(path):
              return pathlib.Path(path).read_bytes().decode('utf-8')

          def write(path, s):
              pathlib.Path(path).write_bytes(s.encode('utf-8'))

          def edit(path, pairs):
              s = read(path)
              for old, new in pairs:
                  if old in s:
                      s = s.replace(old, new)
                  elif new not in s:
                      sys.exit(f"ERROR: no se encontro el texto esperado en {path}:\n{old}")
              write(path, s)

          mk = read('Makefile')
          write('Makefile', mk.replace('-march=x86-64-v3', '-march=x86-64-v2'))
          mk = read('Makefile')
          assert 'x86-64-v3' not in mk and 'x86-64-v2' in mk, 'Makefile sin cambiar'

          cpu_old = 'if (__builtin_cpu_supports("avx2") && __builtin_cpu_supports("fma") && __builtin_cpu_supports("bmi2")) return;'
          cpu_new = 'if (__builtin_cpu_supports("sse4.2") && __builtin_cpu_supports("popcnt")) return;'
          edit('runtime/platform/windows.c', [
              (cpu_old, cpu_new),
              ('needs a CPU with AVX2 (Intel Haswell / 2013 or newer, AMD Excavator / Zen or newer).',
               'needs a CPU with SSE4.2 and POPCNT (Intel Nehalem / 2008 or newer).'),
          ])
          edit('runtime/platform/linux.c', [(cpu_old, cpu_new)])

          # La runtime C de Zig (mingw libc/libm, compiler-rt) se compila al enlazar la sonda de zig_slim.sh SIN -mcpu,
          # asi que usa la CPU nativa del runner de GitHub (AVX2/AVX-512): fmaf() y otras salian con instrucciones VEX
          # y daban c000001d en CPUs sin AVX. Se pasa -mcpu=x86_64_v2 tambien a ese enlace.
          edit('tools/zig_slim.sh', [
              ("flags=()  # (the game code's flags", "cpu=()\nflags=()  # (the game code's flags"),
              ('flags+=("-mcpu=${c//-/_}") ;;', 'flags+=("-mcpu=${c//-/_}"); cpu+=("-mcpu=${c//-/_}") ;;'),
              ('$ZA cc -shared -o probe.dll dll.o host.a -v 2> link.log', '$ZA cc "${cpu[@]}" -shared -o probe.dll dll.o host.a -v 2> link.log'),
          ])
          zs = read('tools/zig_slim.sh')
          assert zs.count('"${cpu[@]}"') == 1 and 'cpu+=(' in zs, 'zig_slim.sh sin cambiar'
          # Importacion del heap del juego como buffer de GPU (texto invisible en iGPU con poca RAM)
          EXEC_PAIRS = [
           # 1) la importacion "completa" pasa a ser un intento con tamano dado, y registra por que falla
           ("static bool gmem_import(uint64_t size) {\n",
            "static bool gmem_import_one(uint64_t size) {\n"),
           ("    if (vkAllocateMemory(g_vk.dev, &ai, NULL, &mem) != VK_SUCCESS) return false;\n",
            "    VkResult gm_r = vkAllocateMemory(g_vk.dev, &ai, NULL, &mem);\n"
            "    if (gm_r != VK_SUCCESS) {\n"
            "        LOG(\"[vk] gmem import %llu MB: vkAllocateMemory failed (VkResult %d)\\n\", (unsigned long long)(size >> 20), (int)gm_r);\n"
            "        return false;\n"
            "    }\n"),
           ("    if (vkCreateBuffer(g_vk.dev, &bi, NULL, &buf) != VK_SUCCESS) { vkFreeMemory(g_vk.dev, mem, NULL); return false; }\n",
            "    gm_r = vkCreateBuffer(g_vk.dev, &bi, NULL, &buf);\n"
            "    if (gm_r != VK_SUCCESS) {\n"
            "        LOG(\"[vk] gmem import %llu MB: vkCreateBuffer failed (VkResult %d)\\n\", (unsigned long long)(size >> 20), (int)gm_r);\n"
            "        vkFreeMemory(g_vk.dev, mem, NULL);\n"
            "        return false;\n"
            "    }\n"),
           # 2) envoltorio: si el heap completo no se puede importar (iGPU con 4 GB de RAM), prueba prefijos mas pequenos
           ("static uint64_t gmem_tried;  // heap size the import was last attempted for (gmem_info imports / re-imports)\n",
            "// Fork SSE4.2: on an iGPU with little RAM (shared GPU memory is about half of it) the whole guest heap cannot be imported, and every\n"
            "// shader global-memory read then returns zero (UI text in Let's Go). Try smaller prefixes of the heap: reads past the imported range\n"
            "// are harmless (robustBufferAccess, descriptor range = imported size), reads inside it work. LARECOMP_VK_GMEM_MB=<n> forces a size.\n"
            "static bool gmem_import(uint64_t size) {\n"
            "    const uint64_t mb = 1ull << 20;\n"
            "    uint64_t lim = g_vk.props.limits.maxStorageBufferRange;\n"
            "    uint64_t forced = getenv(\"LARECOMP_VK_GMEM_MB\") ? (uint64_t)strtoull(getenv(\"LARECOMP_VK_GMEM_MB\"), NULL, 10) * mb : 0;\n"
            "    uint64_t cand[] = {size, 2048 * mb, 1536 * mb, 1024 * mb, 768 * mb, 512 * mb, 256 * mb};\n"
            "    LOG(\"[vk] gmem import: heap %llu MB, maxStorageBufferRange %llu MB%s\\n\", (unsigned long long)(size >> 20), (unsigned long long)(lim >> 20),\n"
            "        forced ? \" (LARECOMP_VK_GMEM_MB forced)\" : \"\");\n"
            "    if (forced) { cand[0] = forced; return forced <= size && forced > gmem_size && gmem_import_one(forced); }\n"
            "    uint64_t last = 0;\n"
            "    for (size_t i = 0; i < sizeof cand / sizeof cand[0]; i++) {\n"
            "        uint64_t s = cand[i];\n"
            "        if (s > size || s == last || (lim && s > lim)) continue;\n"
            "        if (s <= gmem_size) break;  // (a bigger import is already in place)\n"
            "        last = s;\n"
            "        if (gmem_import_one(s)) return true;\n"
            "    }\n"
            "    return false;\n"
            "}\n"
            "\n"
            "static uint64_t gmem_tried;  // heap size the import was last attempted for (gmem_info imports / re-imports)\n"
            "static uint64_t gmem_want_tried;  // heap size gmem_info last tried to import (a partial import must not retry on every call)\n"),
           # 3) gmem_info: un import parcial no debe reintentarse en cada llamada
           ("    if (!off && want > gmem_size && !gmem_import(want)) {\n"
            "        LOG(\"[vk] guest heap import failed (%llu MB): shader global memory reads return zero\\n\", (unsigned long long)(want >> 20));\n"
            "        off = 1;\n"
            "    }\n",
            "    if (!off && want > gmem_size && want != gmem_want_tried) {\n"
            "        gmem_want_tried = want;\n"
            "        if (!gmem_import(want)) {\n"
            "            LOG(\"[vk] guest heap import failed (%llu MB): shader global memory reads return zero\\n\", (unsigned long long)(want >> 20));\n"
            "            off = 1;\n"
            "        } else if (gmem_size < want) {\n"
            "            LOG(\"[vk] guest heap imported only in part (%llu of %llu MB): global memory beyond reads zero\\n\", (unsigned long long)(gmem_size >> 20), (unsigned long long)(want >> 20));\n"
            "        }\n"
            "    }\n"),
           ("    gmem_size = gmem_tried = 0;\n",
            "    gmem_size = gmem_tried = gmem_want_tried = 0;\n"),
          ]
          edit('runtime/nvn/vulkan/exec.c', EXEC_PAIRS)
          print('Cambios SSE4.2 aplicados')
          PY
          grep -n "GENARCH  ?=" Makefile
          grep -n "supports" runtime/platform/windows.c
          if grep -q 'supports("avx2")' runtime/platform/windows.c; then
            echo "::error::windows.c sigue exigiendo AVX2"; exit 1
          fi

      # Entorno Python del generador de código (el Makefile busca .venv/Scripts/python.exe).
      - name: Crear .venv con las dependencias del generador
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install lz4 capstone unicorn pyinstaller

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            zip
            unzip
            curl
            git
            diffutils
            patch
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-vulkan-devel
            mingw-w64-ucrt-x86_64-shaderc
            mingw-w64-ucrt-x86_64-spirv-tools
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-vulkan-memory-allocator

      # FFmpeg LGPL (lo más lento: ~15-30 min la primera vez; después sale de la caché).
      - name: Caché de dependencias (FFmpeg LGPL y Zig)
        uses: actions/cache@v4
        with:
          path: |
            build/deps-win
            build/zig-dl
          key: deps-${{ runner.os }}-${{ hashFiles('tools/build_deps_windows.sh', 'tools/fetch_zig.sh') }}

      - name: make deps-windows
        shell: msys2 {0}
        run: make deps-windows

      - name: make gen-helper (generador congelado con PyInstaller)
        shell: msys2 {0}
        run: make gen-helper

      - name: Descargar Zig (versión fija, con sha256)
        shell: msys2 {0}
        run: tools/fetch_zig.sh

      - name: make dist
        shell: msys2 {0}
        run: make dist

      # Aviso temprano: la runtime C de Zig que se enlaza al juego no debe contener instrucciones AVX (VEX/YMM).
      - name: Comprobar que la runtime de Zig no usa AVX
        shell: msys2 {0}
        run: |
          n=0
          for f in build/zig-slim/rt/*.lib build/zig-slim/rt/*.obj; do
            [ -f "$f" ] || continue
            c=$(objdump -d -M intel "$f" 2>/dev/null | grep -E -c '[[:space:]]v(zeroupper|movdq[au]|movups|movaps|pxor|cvtss2sd|cvtsd2ss|mulsd|addsd)|ymm' || true)
            echo "$f: instrucciones AVX = $c"
            n=$((n + c))
          done
          echo "Total instrucciones AVX en la runtime de Zig: $n"
          if [ "$n" -gt 0 ]; then
            echo "::warning::La runtime de Zig todavia contiene instrucciones AVX ($n). Puede fallar en CPUs sin AVX."
          fi

      - name: Localizar el zip
        id: zip
        shell: bash
        run: |
          f=$(ls build/dist/LetsGoRecomp-*-windows.zip | head -n1)
          echo "path=$f" >> "$GITHUB_OUTPUT"
          echo "Zip generado: $f"
          ls -lh "$f"

      - uses: actions/upload-artifact@v4
        with:
          name: LetsGoRecomp-sse42-windows
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error
          retention-days: 30
